name: Build TP-LINK WR842N V3 PrintServer Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Cache build dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/openwrt
          ~/.ccache
        key: ${{ runner.os }}-openwrt-${{ hashFiles('configs/.config') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-
          
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get upgrade
        sudo apt-get install -y \
          build-essential ccache ecj fastjar file g++ gawk \
          gettext git java-propose-classpath libelf-dev libncurses5-dev \
          libncursesw5-dev libssl-dev 2to3 python2 python-is-python3 python3 unzip wget \
          python3-distutils python3-setuptools python3-dev rsync subversion \
          swig time xsltproc zlib1g-dev
          
    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        
    - name: Download OpenWrt source
      run: |
        cd ~
        if [ ! -d "openwrt" ]; then
          git clone https://gitcode.com/lh85558/openwrt.git -b openwrt-21.02
        fi
        cd openwrt
        git pull
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
    - name: Copy configuration
      run: |
        cp $GITHUB_WORKSPACE/configs/.config ~/openwrt/
        cp -r $GITHUB_WORKSPACE/files ~/openwrt/
        cp -r $GITHUB_WORKSPACE/patches ~/openwrt/
        
    - name: Apply patches
      run: |
        cd ~/openwrt
        for patch in patches/*.patch; do
          if [ -f "$patch" ]; then
            patch -p1 < "$patch" || true
          fi
        done
        
    - name: Configure build
      run: |
        cd ~/openwrt
        make defconfig
        
    - name: Build firmware
      run: |
        cd ~/openwrt
        make -j$(nproc) download world
        
    - name: Copy firmware files
      run: |
        mkdir -p $GITHUB_WORKSPACE/firmware
        cp ~/openwrt/bin/targets/ar71xx/generic/*842n*v3*sysupgrade.bin $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
        cp ~/openwrt/bin/targets/ar71xx/generic/*842n*v3*factory.bin $GITHUB_WORKSPACE/firmware/ 2>/dev/null || true
        cp ~/openwrt/bin/targets/ar71xx/generic/*842n*v3*sysupgrade.bin $GITHUB_WORKSPACE/firmware/openwrt-ar71xx-generic-tl-wr842n-v3-squashfs-sysupgrade.bin 2>/dev/null || true
        cp ~/openwrt/bin/targets/ar71xx/generic/*842n*v3*factory.bin $GITHUB_WORKSPACE/firmware/openwrt-ar71xx-generic-tl-wr842n-v3-squashfs-factory.bin 2>/dev/null || true
        
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tplink-842n-v3-printserver-firmware
        path: firmware/*.bin
        retention-days: 30
        
    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: TP-LINK WR842N V3 PrintServer Firmware v${{ github.run_number }}
        body: |
          ## TP-LINK WR842N V3 中文打印服务器固件
          
          基于 OpenWrt 21.02 编译，集成 CUPS 2.4.2 中文打印服务
          
          ### 功能特性
          - CUPS 2.4.2 中文打印服务
          - HP LaserJet 1020/1020plus/1007/1008/1108 驱动
          - USB打印机支持，VirtualHere虚拟USB
          - 网络打印机支持，远程打印功能
          - 定时重启，一键切换无线AP模式
          - 全中文Web管理界面
          
          ### 默认配置
          - LAN IP: 192.168.10.1
          - Web登录: admin / thdn12345678
          - Wi-Fi SSID: THDN-dayin
          - Wi-Fi密码: thdn12345678
          - 主机名: THDN-PrintServer
          
          ### 刷机说明
          - **首次刷机**: 使用 factory.bin 文件
          - **在线升级**: 使用 sysupgrade.bin 文件
          
          **注意**: 刷机有风险，请谨慎操作！
        files: |
          firmware/*.bin
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
